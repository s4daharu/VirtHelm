name: Docs and Android checks

# Keep the historical workflow name so existing required-check configuration
# continues to resolve. Android compilation moved to android-ci.yml.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check_docs.py
      - run: python3 scripts/check_premium.py
      - run: python3 scripts/check_source.py
      - run: python3 -m unittest discover -s scripts/tests -v
