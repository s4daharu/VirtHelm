name: Docs and Android checks
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check_docs.py
      - run: python3 scripts/check_premium.py
      - run: python3 scripts/check_source.py
      - run: python3 -m unittest discover -s scripts/tests -v

  detect-app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_app: ${{ steps.detect.outputs.has_app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: detect
        shell: bash
        run: |
          if [[ -f app/pubspec.yaml && -f app/pubspec.lock ]]; then
            echo 'has_app=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_app=false' >> "$GITHUB_OUTPUT"
          fi

  flutter:
    needs: detect-app
    if: needs.detect-app.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.44.4'
      - run: bash ../scripts/bootstrap_android.sh
      - run: git diff --exit-code -- pubspec.lock
      - run: python3 ../scripts/check_android_generated.py
      - name: Verify Dart formatting
        shell: bash
        run: |
          dart format lib test
          git diff -- lib test
          git diff --exit-code -- lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - run: flutter build apk --debug
      # Compile-only gate: APK downloads are published by release-android.yml
      # directly to GitHub Releases, never to Actions artifact storage.
