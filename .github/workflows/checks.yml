name: Docs and Android checks
on:
  push:
  pull_request:
jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_docs.py
      - run: python3 scripts/check_premium.py
      - run: python3 scripts/check_source.py
  detect-app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_app: ${{ steps.detect.outputs.has_app }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        shell: bash
        run: |
          if [[ -f app/pubspec.yaml ]]; then
            echo 'has_app=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_app=false' >> "$GITHUB_OUTPUT"
          fi
  flutter:
    needs: detect-app
    if: needs.detect-app.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'  # AGP 8-era template; avoid current AGP 9 plugin resolution regression
      - run: bash ../scripts/bootstrap_android.sh
      - run: dart format lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: VirtHelm-debug-APK
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
