name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/android/**'
      - 'scripts/bootstrap_android.sh'
      - 'scripts/harden_android.py'
      - 'scripts/check_android_generated.py'
      - 'scripts/configure_ci_gradle.py'
      - '.github/workflows/android-ci.yml'
      - '.github/workflows/release-android.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'scripts/android/**'
      - 'scripts/bootstrap_android.sh'
      - 'scripts/harden_android.py'
      - 'scripts/check_android_generated.py'
      - 'scripts/configure_ci_gradle.py'
      - '.github/workflows/android-ci.yml'
      - '.github/workflows/release-android.yml'
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check_docs.py
      - run: python3 scripts/check_premium.py
      - run: python3 scripts/check_source.py
      - run: python3 -m unittest discover -s scripts/tests -v

  flutter:
    name: Flutter checks and ARM64 compile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          problem-matcher: true

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true

      - name: Configure hosted runner build resources
        run: python3 ../scripts/configure_ci_gradle.py

      - name: Bootstrap hardened Android runner
        run: bash ../scripts/bootstrap_android.sh

      - name: Setup Gradle build cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          gradle-home-cache-includes: |
            caches
            wrapper
          add-job-summary: on-failure


      - name: Verify generated runner and lockfile
        run: |
          git diff --exit-code -- pubspec.lock
          python3 ../scripts/check_android_generated.py

      - name: Verify Dart formatting
        shell: bash
        run: |
          dart format lib test
          git diff -- lib test
          git diff --exit-code -- lib test

      - name: Analyze
        run: flutter analyze --no-pub --fatal-infos

      - name: Test
        run: flutter test --no-pub

      - name: Compile ARM64 debug APK
        run: flutter build apk --debug --target-platform android-arm64 --no-pub

      - name: Stop Gradle daemons
        if: always()
        run: |
          if [[ -f android/gradlew ]]; then
            (cd android && ./gradlew --stop)
          fi

      # Compile-only gate. Signed APK downloads are published by
      # release-android.yml directly to GitHub Releases.
